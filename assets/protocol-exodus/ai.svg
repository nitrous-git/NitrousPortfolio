<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Multi-layered faction AI</title><desc id="desc">Strategic goals, coordinated missions and individual tactical autonomy.</desc>
