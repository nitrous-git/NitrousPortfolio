<rect width="960" height="540" fill="#0c1017"/><rect width="960" height="540" fill="url(#grid)" opacity=".6"/>
<g font-family="Arial, sans-serif"><text x="42" y="41" fill="#b09aff" font-size="14" letter-spacing="3">PROTOCOL EXODUS / SYSTEM ARCHITECTURE</text><text x="42" y="78" font-size="28" fill="#f2f2f2" font-weight="bold">Multi-layered faction AI</text><text x="42" y="105" fill="#aab6c8" font-size="15">Strategic goals, coordinated missions and individual tactical autonomy.</text>
