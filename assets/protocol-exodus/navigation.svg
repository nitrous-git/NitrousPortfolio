<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Shared navigation stack</title><desc id="desc">Global routes, local motion and final placement remain separate concerns.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1d2430" stroke-width="1"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b09aff"/></marker></defs>
<rect width="960" height="540" fill="#0c1017"/><rect width="960" height="540" fill="url(#grid)" opacity=".6"/>
<g font-family="Arial, sans-serif"><text x="42" y="41" fill="#b09aff" font-size="14" letter-spacing="3">PROTOCOL EXODUS / SYSTEM ARCHITECTURE</text><text x="42" y="78" font-size="28" fill="#f2f2f2" font-weight="bold">Shared navigation stack</text><text x="42" y="105" fill="#aab6c8" font-size="15">Global routes, local motion and final placement remain separate concerns.</text>
<g fill="none" stroke="#b09aff" stroke-width="2" marker-end="url(#arrow)"><path d="M480 193V211H190V232"/><path d="M480 193V232"/><path d="M480 193V211H770V232"/><path d="M190 298V324H310V344"/><path d="M480 298V324H310V344"/><path d="M770 298V324H310V344"/><path d="M460 383H500"/></g>
<g><rect x="330" y="127" width="300" height="66" rx="5" fill="#171d28" stroke="#65749a" stroke-width="1.5"/><text x="480" y="155" text-anchor="middle" font-size="17" font-weight="bold" fill="#f2f2f2">Move / attack order</text><text x="480" y="178" text-anchor="middle" font-size="14" fill="#bfc7d8">Group destination allocation</text></g><g><rect x="55" y="232" width="270" height="66" rx="5" fill="#171d28" stroke="#65749a" stroke-width="1.5"/><text x="190" y="260" text-anchor="middle" font-size="17" font-weight="bold" fill="#f2f2f2">Individual A*</text><text x="190" y="283" text-anchor="middle" font-size="14" fill="#bfc7d8">Small groups / individual paths</text></g><g><rect x="345" y="232" width="270" height="66" rx="5" fill="#171d28" stroke="#65749a" stroke-width="1.5"/><text x="480" y="260" text-anchor="middle" font-size="17" font-weight="bold" fill="#f2f2f2">Shared Flow Field</text><text x="480" y="283" text-anchor="middle" font-size="14" fill="#bfc7d8">Integration + direction fields</text></g><g><rect x="635" y="232" width="270" height="66" rx="5" fill="#171d28" stroke="#65749a" stroke-width="1.5"/><text x="770" y="260" text-anchor="middle" font-size="17" font-weight="bold" fill="#f2f2f2">Formation / slots</text><text x="770" y="283" text-anchor="middle" font-size="14" fill="#bfc7d8">Topology-aware allocation</text></g><g><rect x="160" y="344" width="300" height="78" rx="5" fill="#171d28" stroke="#65749a" stroke-width="1.5"/><text x="310" y="372" text-anchor="middle" font-size="17" font-weight="bold" fill="#f2f2f2">UnitMotor / steering</text><text x="310" y="395" text-anchor="middle" font-size="14" fill="#bfc7d8">Follow route and avoid traffic</text><text x="310" y="414" text-anchor="middle" font-size="14" fill="#bfc7d8">Radius-aware movement</text></g><g><rect x="500" y="344" width="300" height="78" rx="5" fill="#171d28" stroke="#65749a" stroke-width="1.5"/><text x="650" y="372" text-anchor="middle" font-size="17" font-weight="bold" fill="#f2f2f2">Depenetration</text><text x="650" y="395" text-anchor="middle" font-size="14" fill="#bfc7d8">Correct residual overlap</text><text x="650" y="414" text-anchor="middle" font-size="14" fill="#bfc7d8">Separate from path planning</text></g>
<path d="M42 480H918" stroke="#394254"/><text x="42" y="509" font-size="14" fill="#aab6c8">Simplified architecture — global navigation does not replace formation or local movement.</text></g></svg>